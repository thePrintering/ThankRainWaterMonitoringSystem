<!DOCTYPE html>
<html lang="fr">
<head>
    <title>Cuve - File Manager SD</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="file-manager-style.css">
</head>

<body>
    <header>
        <h1>🗂️ File Manager SD</h1>
    </header>

    <div class="container file-manager-page">
        <div class="left-column">
            <div class="card">
                <div class="controls-section fm-toolbar fm-page-actions">
                    <button id="fmBackBtn" type="button">← Retour au tableau de bord</button>
                </div>

                <div class="controls-section fm-toolbar">
                    <button id="fmRefreshBtn" type="button">↻ Rafraichir</button>
                    <button id="fmUpBtn" type="button">⬆ Dossier parent</button>
                    <button id="fmPrevBtn" type="button">◀ Page precedente</button>
                    <button id="fmNextBtn" type="button">Page suivante ▶</button>
                    <span id="fmPageInfo" class="fm-page-info">Offset: 0</span>
                </div>

                <div class="controls-section fm-toolbar">
                    <span id="fmPath" class="fm-path">/</span>
                </div>

                <div class="controls-section fm-toolbar">
                    <input id="fmNewDirName" type="text" placeholder="Nom du dossier" />
                    <button id="fmMkdirBtn" type="button">📁 Creer dossier</button>
                </div>

                <div class="table-wrapper fm-table-wrapper">
                    <table id="fmTable">
                        <thead>
                            <tr>
                                <th>Nom</th>
                                <th>Type</th>
                                <th>Taille</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>

                <form id="fmUploadForm" enctype="multipart/form-data" class="fm-upload-form">
                    <input id="fmUploadFile" type="file" name="file" />
                    <button type="submit">📤 Uploader ici</button>
                </form>

                <div id="fmStatus" class="fm-status" role="status" aria-live="polite"></div>
            </div>
        </div>
    </div>

    <script src="file-manager-script.js"></script>
</body>
</html>
