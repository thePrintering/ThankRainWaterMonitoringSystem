<!DOCTYPE html>
<html lang="fr">
<head>
    <title>Cuve - Temps réel</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="dashboard-style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/plugins/monthSelect/style.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/plugins/monthSelect/index.js"></script>
</head>

<body>
    <header>
        <h1>💧 Système de Monitoring Citerne</h1>
    </header>
    <div class="container">
        <div class="left-column">
            <div class="card">
                <div>
                    <h2>📦 Niveau de la cuve (Temps réel)</h2>
                    <div class="status-strip" aria-label="Etat systeme">
                        <div id="wifiStatus" class="status-chip status-unknown" title="Etat de connexion WiFi">
                            <span class="status-icon" aria-hidden="true">📶</span>
                            <span class="status-label">WiFi</span>
                            <span id="wifiStatusText" class="status-value">Inconnu</span>
                        </div>
                        <div id="sensorStatus" class="status-chip status-unknown" title="Etat du capteur ultrason">
                            <span class="status-icon" aria-hidden="true">📡</span>
                            <span class="status-label">Capteur</span>
                            <span id="sensorStatusText" class="status-value">Inconnu</span>
                        </div>
                        <div id="sdStatus" class="status-chip status-unknown" title="Etat de la carte SD">
                            <span class="status-icon" aria-hidden="true">💾</span>
                            <span class="status-label">SD</span>
                            <span id="sdStatusText" class="status-value">Inconnu</span>
                        </div>
                    </div>
                    <p>Heure : <span id="time" style="font-weight: 600; color: #3498db;">--</span></p>
                    <div class="label">Niveau</div>
                    <div id="percent" class="value">--</div>
                    <div class="label">Volume éstimé</div>
                    <div id="volume" class="value">--</div>

                    <div class="controls-section">
                        <button id="rebootBtn">🔄 Redémarrer</button>
                        <button id="openSettingsBtn">⚙️ Paramètres</button>
                        <button id="openFileManagerBtn" type="button">🗂️ Gestion des fichiers</button>
                        <button id="forceMeasurementNowBtn" type="button">⚡ Forcer une mesure</button>
                    </div>
                </div>
            </div>

            <div class="card">
                <h3>📊 Historique du niveau de la cuve</h3>
                <div class="controls-section">
                    <button id="loadTodayBtn">📅 Aujourd'hui</button>
                    <input id="calendar" placeholder="📅 Choisir une date">
                    <select id="timeRangeSelect">
                        <option value="day">Un jour</option>
                        <option value="month">Un mois</option>
                        <option value="year">Une année</option>
                    </select>
                </div>
                
                <div class="chart-container">
                    <canvas id="historicalChart"></canvas>
                </div>
            </div>
        </div>

        <div class="right-column">
            <div class="card">
                <div class="history-header">
                    <h3>📊 Historique des mesures</h3>
                    <p class="next-measure">Prochaine mesure : <span id="nextMeasureTime">--:--:--</span></p>
                </div>
                <div class="table-wrapper">
                    <table id="history">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Heure</th>
                                <th>Distance (mm)</th>
                                <th>%</th>
                                <th>Volume (L)</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="dashboard-script.js"></script>
</body>
</html>
